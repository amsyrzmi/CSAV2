# Apply after the local staging proposal and shared-Caddy overlay.
# Explicit service targets only; no bootstrap, migration or image pull is needed.
x-runtime: &runtime
  image: ${CSA_STAGING_PYTHON_IMAGE:?approved Python image digest required}
  profiles: ["pipeline-approved"]
  user: "1000:1000"
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  environment: &environment
    ENV: prod
    NO_LOCAL_ENV: "1"
    TURN_ENGINE: coordinator
    CHANNEL_MODE: webhook
    PUBLIC_BASE_URL: ${CSA_STAGING_CONSOLE_ORIGIN:?approved staging origin required}
    KB_UPLOAD_ROOT: /var/lib/csa/uploads
    TEI_ENDPOINT: http://staging-embeddings:8080
    KB_EMBED_MODEL_LABEL: multilingual-e5-small-fd1525a
    TEI_QUERY_PREFIX: "query: "
    TEI_PASSAGE_PREFIX: "passage: "

services:
  gateway:
    restart: unless-stopped
    environment:
      # HR documents: the gateway is the only service that mounts the volume (below).
      HR_UPLOAD_ROOT: /var/lib/csa/hr-uploads
      TEI_ENDPOINT: http://staging-embeddings:8080
      KB_EMBED_MODEL_LABEL: multilingual-e5-small-fd1525a
      TEI_QUERY_PREFIX: "query: "
      TEI_PASSAGE_PREFIX: "passage: "
      # Meta calls the hooks hostname, not the console origin.
      WHATSAPP_CALLBACK_BASE_URL: ${CSA_STAGING_HOOKS_ORIGIN:?approved staging hooks HTTPS origin required}
      # Invitation and reset mail. Off unless the owner sets CSA_STAGING_INVITE_MAIL=true.
      INVITE_MAIL_ENABLED: ${CSA_STAGING_INVITE_MAIL:-false}
      # Staff email assistant (Gmail). Off unless the owner sets CSA_STAGING_EMAIL_ASSISTANT=true.
      EMAIL_ASSISTANT_ENABLED: ${CSA_STAGING_EMAIL_ASSISTANT:-false}
      GOOGLE_OAUTH_REDIRECT_URI: ${CSA_STAGING_CONSOLE_ORIGIN:?approved staging origin required}/console/v1/email/oauth/callback
    secrets:
      - source: staging_whatsapp_app_secret
        target: WHATSAPP_APP_SECRET
      - source: staging_whatsapp_verify_token
        target: WHATSAPP_VERIFY_TOKEN
      # TikTok Shop app credentials; TikTok stays off while any one of the three holds "disabled". The
      # connect callback uses PUBLIC_BASE_URL (the console origin); only the webhook is on
      # the hooks host, so no callback-base variable exists.
      - source: staging_tiktok_app_key
        target: TIKTOK_APP_KEY
      - source: staging_tiktok_app_secret
        target: TIKTOK_APP_SECRET
      - source: staging_tiktok_service_id
        target: TIKTOK_SERVICE_ID
      # Relay credentials; mail stays inactive unless the flag is on and both are present.
      - source: staging_smtp_username
        target: SMTP_USERNAME
      - source: staging_smtp_password
        target: SMTP_PASSWORD
      # Google OAuth client; the assistant stays inactive unless the flag is on.
      - source: staging_google_client_id
        target: GOOGLE_CLIENT_ID
      - source: staging_google_client_secret
        target: GOOGLE_CLIENT_SECRET
    networks: ["data", "app", "embeddings", "provider-egress", "gateway-host"]
    # Loopback-only publish for the staging hooks Caddy site (POST /hooks/* only).
    # 18081 belongs to the development gateway; never reuse it here.
    ports:
      - "127.0.0.1:18031:8080"
    # HR documents live on the gateway only; the worker and delivery never mount them.
    volumes: ["staging-hr-uploads:/var/lib/csa/hr-uploads"]

  worker:
    restart: unless-stopped
    <<: *runtime
    command: ["python", "-m", "apps.worker.main"]
    environment:
      <<: *environment
      KB_INGEST_ENABLED: "true"
      # Booking reminders and mail about a lapsed booking. The same switch as the gateway's: off
      # unless the owner sets CSA_STAGING_INVITE_MAIL=true, and then only with both secrets.
      INVITE_MAIL_ENABLED: ${CSA_STAGING_INVITE_MAIL:-false}
    secrets:
      - source: staging_domain_dsn
        target: DATABASE_URL
      - source: staging_owner_dsn
        target: LG_DATABASE_URL
      - source: staging_credentials_key
        target: CREDENTIALS_KEY
      - source: staging_model_key
        target: GROQ_API_KEY
      # Relay credentials, the gateway's own files; mail stays inactive unless the flag is on and
      # both are present.
      - source: staging_smtp_username
        target: SMTP_USERNAME
      - source: staging_smtp_password
        target: SMTP_PASSWORD
      # TikTok sync, token refresh and order/product jobs run in the worker.
      - source: staging_tiktok_app_key
        target: TIKTOK_APP_KEY
      - source: staging_tiktok_app_secret
        target: TIKTOK_APP_SECRET
      - source: staging_tiktok_service_id
        target: TIKTOK_SERVICE_ID
    volumes: ["staging-uploads:/var/lib/csa/uploads"]
    # provider-egress is a plain bridge with outbound access, the one the worker already reaches
    # the model provider through, so it reaches the SMTP relay too. No network is added.
    networks: ["data", "embeddings", "provider-egress"]
    depends_on:
      staging-db:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/worker.alive').stat().st_mtime < 90"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  delivery:
    restart: unless-stopped
    <<: *runtime
    command: ["python", "-m", "apps.delivery.main"]
    environment:
      <<: *environment
      KB_INGEST_ENABLED: "false"
    secrets:
      - source: staging_domain_dsn
        target: DATABASE_URL
      - source: staging_owner_dsn
        target: LG_DATABASE_URL
      - source: staging_credentials_key
        target: CREDENTIALS_KEY
      - source: staging_disabled_model_key
        target: GROQ_API_KEY
      - source: staging_whatsapp_app_secret
        target: WHATSAPP_APP_SECRET
      - source: staging_whatsapp_verify_token
        target: WHATSAPP_VERIFY_TOKEN
    networks: ["data", "provider-egress"]
    depends_on:
      staging-db:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/delivery.alive').stat().st_mtime < 30"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  embeddings-init:
    image: ${CSA_STAGING_PYTHON_IMAGE:?approved Python image digest required}
    profiles: ["pipeline-bootstrap-approved"]
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    entrypoint: ["chown", "1000:1000", "/data"]
    volumes: ["staging-embeddings:/data"]
    healthcheck:
      disable: true

  staging-embeddings:
    restart: unless-stopped
    # Digest of the CPU image already present on this host; never cpu-latest.
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:cc1f06b5b2e38d979aca1cc054675426bf4d94247f6d22e399d73e09131dfe79
    profiles: ["pipeline-approved"]
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      HF_HOME: /data
    command: ["--model-id", "intfloat/multilingual-e5-small", "--revision", "fd1525a9fd15316a2d503bf26ab031a61d056e98", "--port", "8080", "--huggingface-hub-cache", "/data", "--tokenization-workers", "2", "--max-batch-tokens", "4096"]
    volumes: ["staging-embeddings:/data"]
    networks: ["embeddings", "model-egress"]

  staging-bot-setup:
    <<: *runtime
    profiles: ["test-bot-setup-approved"]
    entrypoint: ["python", "-m", "scripts.staging_test_bot"]
    stdin_open: true
    tty: true
    environment:
      <<: *environment
      CSA_STAGING_HOOKS_ORIGIN: ${CSA_STAGING_HOOKS_ORIGIN:?approved staging hooks HTTPS origin required}
    # Reviewed operator code over the existing accepted runtime image.
    volumes:
      - "../scripts/staging_test_bot.py:/app/scripts/staging_test_bot.py:ro"
      - "../db/sql/staging:/app/db/sql/staging:ro"
    secrets:
      - source: staging_domain_dsn
        target: DATABASE_URL
      - source: staging_checkpoint_dsn
        target: LG_DATABASE_URL
      - source: staging_credentials_key
        target: CREDENTIALS_KEY
      - source: staging_disabled_model_key
        target: GROQ_API_KEY
      - source: staging_owner_dsn
        target: STAGING_OWNER_DSN
      - source: staging_telegram_bot_token
        target: TELEGRAM_BOT_TOKEN
    networks: ["data", "provider-egress"]
    healthcheck:
      disable: true

  # One-shot: register, enable or disable the TikTok Shop app row (scripts.tiktok_app) on the
  # owner connection. Same approval variable and isolated-database check as `migrate`; the
  # command (register, enable or disable) follows the service name. Section 12 of
  # STAGING_PIPELINE.md.
  tiktok-app:
    <<: *runtime
    profiles: ["tiktok-app-approved"]
    environment:
      <<: *environment
      CSA_MIGRATION_APPROVAL: ${CSA_STAGING_MIGRATION_APPROVAL:-disabled}
      CSA_OWNER_DSN_FILE: /run/secrets/MIGRATE_DATABASE_URL
    secrets:
      - source: staging_owner_dsn
        target: MIGRATE_DATABASE_URL
    networks: ["data"]
    entrypoint:
      - python
      - -c
      - |
        import os, runpy, sys
        from pathlib import Path
        from scripts.staging_migrate import approved_target
        dsn = Path(os.environ["CSA_OWNER_DSN_FILE"]).read_text().strip()
        if not approved_target(os.environ.get("CSA_MIGRATION_APPROVAL"), dsn):
            sys.exit("Explicit isolated-staging approval and the isolated staging database required")
        os.environ["MIGRATE_DATABASE_URL"] = dsn
        runpy.run_module("scripts.tiktok_app", run_name="__main__", alter_sys=True)
    healthcheck:
      disable: true

networks:
  embeddings:
    internal: true
  provider-egress:
    driver: bridge
    internal: false
  model-egress:
    driver: bridge
    internal: false
  gateway-host:
    driver: bridge
    internal: false

volumes:
  staging-embeddings:
  staging-hr-uploads:

secrets:
  staging_model_key:
    file: ${CSA_STAGING_SECRET_DIR:?absolute staging secret directory required}/pipeline/staging_model_key
  staging_telegram_bot_token:
    file: ${CSA_STAGING_SECRET_DIR:?absolute staging secret directory required}/pipeline/staging_telegram_bot_token
  # Hold the literal "disabled" until the owner writes the real Meta values.
  staging_whatsapp_app_secret:
    file: ${CSA_STAGING_SECRET_DIR:?absolute staging secret directory required}/pipeline/staging_whatsapp_app_secret
  staging_whatsapp_verify_token:
    file: ${CSA_STAGING_SECRET_DIR:?absolute staging secret directory required}/pipeline/staging_whatsapp_verify_token
  # Hold the literal "disabled" until the owner writes the real TikTok values
  # (`staging_secrets tiktok-defaults`, then section 12 of STAGING_PIPELINE.md).
  staging_tiktok_app_key:
    file: ${CSA_STAGING_SECRET_DIR:?absolute staging secret directory required}/pipeline/staging_tiktok_app_key
  staging_tiktok_app_secret:
    file: ${CSA_STAGING_SECRET_DIR:?absolute staging secret directory required}/pipeline/staging_tiktok_app_secret
  staging_tiktok_service_id:
    file: ${CSA_STAGING_SECRET_DIR:?absolute staging secret directory required}/pipeline/staging_tiktok_service_id
  # Installed by `staging_secrets smtp-install` before a gateway with invitation mail is
  # recreated: compose refuses to start a service whose secret file is missing.
  staging_smtp_username:
    file: ${CSA_STAGING_SECRET_DIR:?absolute staging secret directory required}/runtime/smtp_username
  staging_smtp_password:
    file: ${CSA_STAGING_SECRET_DIR:?absolute staging secret directory required}/runtime/smtp_password
  # Written by the owner before a gateway with the email assistant is recreated (section 11
  # of STAGING_PIPELINE.md): compose refuses to start a service whose secret file is missing.
  staging_google_client_id:
    file: ${CSA_STAGING_SECRET_DIR:?absolute staging secret directory required}/runtime/google_client_id
  staging_google_client_secret:
    file: ${CSA_STAGING_SECRET_DIR:?absolute staging secret directory required}/runtime/google_client_secret
