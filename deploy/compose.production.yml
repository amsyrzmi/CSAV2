# Production overlay. Apply LAST, after the three staging files, with the same profiles:
#   compose.staging-local-proposal.yml, compose.staging-shared-caddy.yml,
#   compose.staging-pipeline.yml, then this file. Requires Compose >= 2.24.4 (`!reset`, `!override`).
#
# It changes only what production does differently from staging, and nothing here is specific to
# one cloud host, so the same file moves to EC2 unchanged:
#   * files live in S3, not in local volumes (STORAGE_BACKEND=s3);
#   * two workers, and memory limits sized for a 2 GB host, so the kernel's OOM killer picks the
#     training worker, then a worker or the frontend, before Postgres;
#   * Postgres settings for 2 GB;
#   * the gateway joins the `edge` network so the tunnel connector can reach it;
#   * the database image can be named by the operator while the registry package is private.
#
# Not secrets: the bucket and region are named in the operator's env file (CSA_PROD_S3_BUCKET,
# CSA_PROD_S3_REGION), never in this repository. The S3 key values are secret FILES only, never
# environment variables: an environment variable would win over the secret file
# (docs/OBJECT_STORAGE.md).
#
# The memory, worker-count and Postgres numbers are starting values. The capacity gate (spec
# section 6) decides whether they hold on the real instance. Every one can be overridden from the
# host's env file (CSA_PROD_MEM_*, CSA_PROD_WORKER_REPLICAS, CSA_PROD_PG_*), so tuning needs no
# code change, image rebuild or pull request. The defaults below are what the tests pin.

# The model endpoint. Production uses Groq. Only the capacity test sets CSA_PROD_GROQ_CHAT_URL, to
# a stub reached by a single-label name (see scripts and docs: deploy/PRODUCTION.md); unset it
# afterwards and recreate the gateway and worker.
x-model-url: &model-url
  GROQ_CHAT_URL: ${CSA_PROD_GROQ_CHAT_URL:-https://api.groq.com/openai/v1/chat/completions}

x-s3-env: &s3-env
  STORAGE_BACKEND: s3
  S3_BUCKET: ${CSA_PROD_S3_BUCKET:?S3 bucket name required}
  S3_REGION: ${CSA_PROD_S3_REGION:?S3 region required}

services:
  staging-db:
    image: ${CSA_PROD_DB_IMAGE:-ghcr.io/amsyrzmi/csa-pg16-postgis-vector@sha256:4e610cbe04be850136f42fffcc1ef546ceff5b13d8f25322738d0d74a9a1fefe}
    # Sized for 2 GB shared with the embedding service. The gateway budgets eight connections per
    # process and four processes (gateway, two workers, delivery) connect, so 60 leaves room for
    # the one-shots and psql.
    command:
      - postgres
      - -c
      - shared_buffers=${CSA_PROD_PG_SHARED_BUFFERS:-192MB}
      - -c
      - effective_cache_size=${CSA_PROD_PG_EFFECTIVE_CACHE:-512MB}
      - -c
      - work_mem=${CSA_PROD_PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${CSA_PROD_PG_MAINTENANCE_MEM:-64MB}
      - -c
      - max_connections=${CSA_PROD_PG_MAX_CONNECTIONS:-60}
      - -c
      - max_parallel_workers_per_gather=0
    mem_limit: ${CSA_PROD_MEM_DB:-640m}
    # Last to be chosen by the OOM killer.
    oom_score_adj: -900

  gateway:
    environment:
      <<: [*s3-env, *model-url]
      # With S3 on, all three local upload folders must be unset or the process refuses to start.
      # A blank value reads as unset (csa/core/settings.py). `!reset null` does NOT work here:
      # Compose keeps a key an earlier file set, so the value would survive.
      KB_UPLOAD_ROOT: ""
      HR_UPLOAD_ROOT: ""
      TRAINING_UPLOAD_ROOT: ""
    secrets:
      - source: prod_s3_app_access_key_id
        target: S3_ACCESS_KEY_ID
      - source: prod_s3_app_secret_access_key
        target: S3_SECRET_ACCESS_KEY
    volumes: !reset []
    # `edge` lets the cloudflared connector reach the gateway for the webhook hostname.
    networks: !override ["data", "app", "embeddings", "provider-egress", "gateway-host", "edge"]
    mem_limit: ${CSA_PROD_MEM_GATEWAY:-400m}
    oom_score_adj: 100

  worker:
    environment:
      <<: [*s3-env, *model-url]
      KB_UPLOAD_ROOT: ""
      HR_UPLOAD_ROOT: ""
    # The worker only reads knowledge-base files, so it gets the key limited to kb/ (docs section
    # "IAM policy for the worker key"). It never needs HR documents.
    secrets:
      - source: prod_s3_worker_access_key_id
        target: S3_ACCESS_KEY_ID
      - source: prod_s3_worker_secret_access_key
        target: S3_SECRET_ACCESS_KEY
    volumes: !reset []
    # Two workers, about twice the turn throughput of one. A worker is the first thing the OOM
    # killer should take.
    deploy:
      replicas: ${CSA_PROD_WORKER_REPLICAS:-2}
    mem_limit: ${CSA_PROD_MEM_WORKER:-320m}
    oom_score_adj: 500

  delivery:
    environment:
      # Delivery never touches files. It keeps the local default backend with no upload folder,
      # so it holds no S3 key.
      KB_UPLOAD_ROOT: ""
      HR_UPLOAD_ROOT: ""
    mem_limit: ${CSA_PROD_MEM_DELIVERY:-200m}
    oom_score_adj: 300

  training-worker:
    environment:
      <<: [*s3-env, *model-url]
      # The staging file already blanks KB_UPLOAD_ROOT and never sets HR_UPLOAD_ROOT here.
      TRAINING_UPLOAD_ROOT: ""
    # Its own key, limited to training/ (docs/OBJECT_STORAGE.md, "IAM policy for the training
    # worker key"); never the application key or the kb/ worker key. Until the owner makes it,
    # CSA_PROD_S3_TRAINING_KEY is unset and both names read the disabled placeholder: compose
    # renders and the worker idles while video is off, and refuses to start if video is switched on
    # with the placeholder. The real files are needed only once the switch names them
    # (CSA_PROD_S3_TRAINING_KEY=prod_s3_training, a reviewed change to production-rollout.env).
    secrets:
      - source: ${CSA_PROD_S3_TRAINING_KEY:-prod_s3_training_disabled}_access_key_id
        target: S3_ACCESS_KEY_ID
      - source: ${CSA_PROD_S3_TRAINING_KEY:-prod_s3_training_disabled}_secret_access_key
        target: S3_SECRET_ACCESS_KEY
    volumes: !reset []
    # 256m, not the 160 MB measured: that was the import set alone, without pools, the S3 client
    # and the upload buffer. Above the workers' 500, so the OOM killer takes a video job first. If it
    # kills the ffmpeg child, the attempt fails as transient and is retried after its backoff (one
    # attempt of 3, the file kept); if it kills the Python process, the job is requeued once its
    # heartbeat goes stale (10 minutes; also one attempt of 3).
    mem_limit: ${CSA_PROD_MEM_TRAINING_WORKER:-256m}
    oom_score_adj: 600

  frontend:
    mem_limit: ${CSA_PROD_MEM_FRONTEND:-256m}
    oom_score_adj: 300

  staging-embeddings:
    # Observed about 880 MB resident; the limit leaves headroom without letting it take the host.
    mem_limit: ${CSA_PROD_MEM_EMBEDDINGS:-1100m}
    oom_score_adj: 200

  cloudflared:
    mem_limit: ${CSA_PROD_MEM_CLOUDFLARED:-96m}

secrets:
  # The application key: kb/ and hr/ read, write and delete, put-only under backups/.
  prod_s3_app_access_key_id:
    file: ${CSA_STAGING_SECRET_DIR:?absolute secret directory required}/storage/s3_app_access_key_id
  prod_s3_app_secret_access_key:
    file: ${CSA_STAGING_SECRET_DIR:?absolute secret directory required}/storage/s3_app_secret_access_key
  # The worker key: kb/ only.
  prod_s3_worker_access_key_id:
    file: ${CSA_STAGING_SECRET_DIR:?absolute secret directory required}/storage/s3_worker_access_key_id
  prod_s3_worker_secret_access_key:
    file: ${CSA_STAGING_SECRET_DIR:?absolute secret directory required}/storage/s3_worker_secret_access_key
  # The training worker key: training/ only. Compose leaves a declared secret nothing uses out of
  # its config, so these two files are needed only once CSA_PROD_S3_TRAINING_KEY names them.
  prod_s3_training_access_key_id:
    file: ${CSA_STAGING_SECRET_DIR:?absolute secret directory required}/storage/s3_training_access_key_id
  prod_s3_training_secret_access_key:
    file: ${CSA_STAGING_SECRET_DIR:?absolute secret directory required}/storage/s3_training_secret_access_key
  # Until then: the existing disabled placeholder (the same file as staging_disabled_model_key).
  prod_s3_training_disabled_access_key_id:
    file: ${CSA_STAGING_SECRET_DIR:?absolute secret directory required}/runtime/staging_disabled_model_key
  prod_s3_training_disabled_secret_access_key:
    file: ${CSA_STAGING_SECRET_DIR:?absolute secret directory required}/runtime/staging_disabled_model_key
