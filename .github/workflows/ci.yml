# CSA CI (LG01 §10). Lint + types + import boundary + migrations-from-scratch +
# tests + secret scan. The Postgres service container is the SAME combined
# PostGIS+pgvector image used by compose.dev.yml, pulled BY DIGEST from GHCR, so
# "works on my machine" and "green in CI" cannot diverge on the extension set.
#
# No production secrets. CI uses fixed, non-secret CSA_* role passwords and a
# freshly generated throwaway CREDENTIALS_KEY — never prod credentials.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  packages: read

env:
  NO_LOCAL_ENV: "1"
  ENV: ci
  # Fixed, NON-SECRET CI role passwords (throwaway, not prod).
  CSA_APP_PASSWORD: ci_app_pw
  CSA_RO_PASSWORD: ci_ro_pw
  # The combined DB image, pinned by digest (same as compose.dev.yml).
  CSA_DB_IMAGE: ghcr.io/amsyrzmi/csa-pg16-postgis-vector@sha256:4e610cbe04be850136f42fffcc1ef546ceff5b13d8f25322738d0d74a9a1fefe

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read

    services:
      postgres:
        image: ghcr.io/amsyrzmi/csa-pg16-postgis-vector@sha256:4e610cbe04be850136f42fffcc1ef546ceff5b13d8f25322738d0d74a9a1fefe
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: csa
          POSTGRES_PASSWORD: ci_owner_pw
          POSTGRES_DB: csa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csa -d csa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Read-only GHCR login so the private combined image can be pulled by
      # digest. This job's GITHUB_TOKEN has only read permissions.
      - name: Log in to GHCR (read-only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.6"

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Import boundary
        run: uv run lint-imports

      - name: Apply schema baseline + migrations from scratch
        env:
          PGPASSWORD: ci_owner_pw
          MIGRATE_DATABASE_URL: postgres://csa:ci_owner_pw@localhost:5432/csa
          LG_SETUP_DATABASE_URL: postgres://csa:ci_owner_pw@localhost:5432/csa
        run: |
          psql "postgres://csa:ci_owner_pw@localhost:5432/csa" \
            -v ON_ERROR_STOP=1 -f db/schema_baseline.sql
          uv run python -m scripts.migrate
          uv run python -m scripts.lg_setup

      - name: Install Chromium for packaged browser acceptance
        run: uv run python -m playwright install --with-deps chromium

      # The hands-free voice browser acceptance (tests/test_voice_browser.py) starts
      # the console's Next.js dev server from its node_modules. Install them here with
      # the same flags the isolated frontend check uses; that check installs into a
      # temporary copy, so it does not populate this directory.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Install console dependencies for browser acceptance
        working-directory: CSA_WebConsole/csa-console/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pytest
        env:
          # A freshly generated throwaway AES-256-GCM key for crypto tests.
          CI_DATABASE_URL: postgres://csa_app:ci_app_pw@localhost:5432/csa
        run: |
          export CREDENTIALS_KEY="base64:$(head -c 32 /dev/urandom | base64)"
          uv run pytest

      - name: Gitleaks (no secrets in the checkout / history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Policy branch coverage (90 percent minimum)
        run: make coverage

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Reviewed isolated install, tests, lint, types, build and trace checks
        run: node CSA_WebConsole/csa-console/web/scripts/check-isolated.mjs --install

  package:
    needs: [gate, frontend]
    runs-on: ubuntu-latest
    # Build-only artifacts, including for PR review. No registry write or deployment.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - uses: docker/setup-buildx-action@v3
      - name: Materialize reviewed contexts from clean source
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -m scripts.release_context "$RUNNER_TEMP/python-context"
          node CSA_WebConsole/csa-console/web/scripts/check-isolated.mjs \
            --context "$RUNNER_TEMP/frontend-context"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build separate OCI archives (never publish)
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          for app in python frontend; do
            (cd "$RUNNER_TEMP/$app-context" && \
              find . -type f -print0 | sort -z | xargs -0 sha256sum) \
              > "$RUNNER_TEMP/release/$app.inputs.sha256"
            docker buildx build --platform linux/amd64 \
              --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
              --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
              --build-arg CSA_CONSOLE_API_ORIGIN=http://gateway:8080 \
              --tag "csa-$app:$SOURCE_REVISION" \
              --output "type=oci,dest=$RUNNER_TEMP/release/$app.oci.tar,rewrite-timestamp=true" \
              --metadata-file "$RUNNER_TEMP/release/$app.metadata.json" \
              "$RUNNER_TEMP/$app-context"
          done
          printf 'source_revision=%s\nsource_date_epoch=%s\nplatform=linux/amd64\nconsole_api_origin=http://gateway:8080\npromotion=disabled\n' \
            "$SOURCE_REVISION" "$SOURCE_DATE_EPOCH" > "$RUNNER_TEMP/release/release.txt"
          cd "$RUNNER_TEMP/release"
          sha256sum *.oci.tar *.metadata.json *.inputs.sha256 release.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: csa-review-only-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
