# Deploy one commit on main to production through AWS Systems Manager Run Command. Manual
# dispatch only. `plan` resolves and checks the commit (the `sha` input, or the tip of main) with
# deploy/production/resolve_commit.sh: its ci run succeeded, it was staged, both images are
# published for it and it is on main; a failed check stops the run before anything is sent. It then
# sends the read-only plan, with the image digests, to the instance and shows it in the job
# summary. `apply` waits for the `production` environment approval, then (unless the sha was given
# explicitly) checks that main has not moved since the plan, and sends exactly the SHA, migrations,
# host settings digest and image digests that plan used; the rollout on the instance refuses if
# the SHA, migrations or host settings digest have changed. When the apply succeeds, a public smoke
# test asks the console origin for its login page. AWS access is a short-lived OIDC role session,
# and each job has its own role: the plan role can send only the plan document, which has the
# action fixed to plan, so the reviewer-less `production-plan` environment can never apply. The
# role ARNs, the instance id and the console origin are environment secrets (masked in the public
# logs), the region a repository variable; a missing one stops the run before any AWS call. Both
# jobs run only for main, and the runner scripts always come from a checkout of main, never from
# the commit being deployed.
name: deploy-production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA on main (empty = the tip of main)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production-plan
    timeout-minutes: 130
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
    outputs:
      sha: ${{ steps.parse.outputs.sha }}
      migrations: ${{ steps.parse.outputs.migrations }}
      host_digest: ${{ steps.parse.outputs.host_digest }}
      python_digest: ${{ steps.target.outputs.python_digest }}
      frontend_digest: ${{ steps.target.outputs.frontend_digest }}
      explicit: ${{ steps.target.outputs.explicit }}
    env:
      ROLE_ARN: ${{ secrets.PROD_PLAN_ROLE_ARN }}
      AWS_REGION: ${{ vars.PROD_DEPLOY_REGION }}
      INSTANCE_ID: ${{ secrets.PROD_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # The script prints sha, the two image digests, staged_on and explicit on success, and one
      # message on stderr (kept in the log) with a non-zero exit on any failed check.
      - name: Resolve and check the commit
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          deploy/production/resolve_commit.sh "$INPUT_SHA" >> "$GITHUB_OUTPUT"

      - name: Require the deploy variables
        run: |
          set -euo pipefail
          [ -n "${ROLE_ARN:-}" ] || { echo "secret PROD_PLAN_ROLE_ARN is not set on the production-plan environment" >&2; exit 1; }
          [ -n "${AWS_REGION:-}" ] || { echo "repository variable PROD_DEPLOY_REGION is not set" >&2; exit 1; }
          [ -n "${INSTANCE_ID:-}" ] || { echo "secret PROD_INSTANCE_ID is not set on the production-plan environment" >&2; exit 1; }

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.PROD_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.PROD_DEPLOY_REGION }}
          role-session-name: deploy-production-plan
          mask-aws-account-id: true

      - name: Plan on the production instance
        env:
          SHA: ${{ steps.target.outputs.sha }}
          PYTHON_DIGEST: ${{ steps.target.outputs.python_digest }}
          FRONTEND_DIGEST: ${{ steps.target.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          status=0
          # Instance output is data: no line of it (stdout, or the stderr ssm_run.sh passes on)
          # may act as a workflow command. The trap resumes command processing however the
          # step ends.
          token="$(uuidgen)"
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          deploy/production/ssm_run.sh plan "$SHA" > "$RUNNER_TEMP/plan.txt" || status="$?"
          sed -e '$a\' "$RUNNER_TEMP/plan.txt" || true
          {
            echo "### Production plan for \`$SHA\`"
            echo
            echo '````'
            sed -e '$a\' "$RUNNER_TEMP/plan.txt"
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Read the plan
        id: parse
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          deploy/production/parse_plan.sh "$RUNNER_TEMP/plan.txt" "$SHA" >> "$GITHUB_OUTPUT"

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 130
    permissions:
      contents: read
      deployments: read
      id-token: write
    env:
      ROLE_ARN: ${{ secrets.PROD_APPLY_ROLE_ARN }}
      AWS_REGION: ${{ vars.PROD_DEPLOY_REGION }}
      INSTANCE_ID: ${{ secrets.PROD_INSTANCE_ID }}
      PROD_CONSOLE_ORIGIN: ${{ secrets.PROD_CONSOLE_ORIGIN }}
    steps:
      - name: Require the deploy variables
        run: |
          set -euo pipefail
          [ -n "${ROLE_ARN:-}" ] || { echo "secret PROD_APPLY_ROLE_ARN is not set on the production environment" >&2; exit 1; }
          [ -n "${AWS_REGION:-}" ] || { echo "repository variable PROD_DEPLOY_REGION is not set" >&2; exit 1; }
          [ -n "${INSTANCE_ID:-}" ] || { echo "secret PROD_INSTANCE_ID is not set on the production environment" >&2; exit 1; }
          [ -n "${PROD_CONSOLE_ORIGIN:-}" ] || { echo "secret PROD_CONSOLE_ORIGIN is not set on the production environment" >&2; exit 1; }

      # An approval can arrive long after the plan. Unless the sha was given explicitly (a
      # rollback to an older staged commit), main must still be at the planned commit. This reads
      # the tip and sends nothing; any failure to read it fails the step.
      - name: Check the commit is still current
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          EXPLICIT: ${{ needs.plan.outputs.explicit }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          if [ "$EXPLICIT" = "true" ]; then
            echo "The sha was given explicitly; the tip of main is not checked."
            exit 0
          fi
          [ "$EXPLICIT" = "false" ] || { echo "the plan did not say whether the sha was explicit" >&2; exit 1; }
          tip="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)" || { echo "could not read the tip of main" >&2; exit 1; }
          if [[ ! "$tip" =~ ^[0-9a-f]{40}$ || "$tip" == *$'\n'* ]]; then
            echo "could not read the tip of main" >&2
            exit 1
          fi
          if [ "$tip" != "$SHA" ]; then
            echo "main moved to ${tip:0:7} since this run's plan; start the workflow again" >&2
            exit 1
          fi
          echo "main is still at the planned commit."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.PROD_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.PROD_DEPLOY_REGION }}
          role-session-name: deploy-production-apply
          mask-aws-account-id: true

      - name: Apply on the production instance
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          MIGRATIONS: ${{ needs.plan.outputs.migrations }}
          HOST_DIGEST: ${{ needs.plan.outputs.host_digest }}
          PYTHON_DIGEST: ${{ needs.plan.outputs.python_digest }}
          FRONTEND_DIGEST: ${{ needs.plan.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          status=0
          # Instance output is data: no line of it (stdout, or the stderr ssm_run.sh passes on)
          # may act as a workflow command. The trap resumes command processing however the
          # step ends.
          token="$(uuidgen)"
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          deploy/production/ssm_run.sh apply "$SHA" "$MIGRATIONS" "$HOST_DIGEST" > "$RUNNER_TEMP/apply.txt" || status="$?"
          sed -e '$a\' "$RUNNER_TEMP/apply.txt" || true
          {
            echo "### Production apply of \`$SHA\`"
            echo
            echo '````'
            sed -e '$a\' "$RUNNER_TEMP/apply.txt"
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Public smoke test
        run: |
          set -euo pipefail
          deploy/production/public_smoke.sh "$PROD_CONSOLE_ORIGIN"
